.f-cab{display:flex;align-items:center;gap:12px;margin-bottom:12px}.f-cab .tx{flex:1;min-width:0}.f-cab b{font-size:17px;display:block}.f-cab small{color:var(--mut)}
.fechar{width:44px;height:44px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--azul-cl);color:var(--acento);font-size:20px;border:2px solid var(--acento);box-shadow:var(--sombra)}

.maq-ag{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);margin:-4px 0 10px}
.ok-est{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 4px 4px}
.ok-est b{font-size:20px}.ok-est.v b{color:var(--verde)}.ok-est.a b{color:var(--amar-esc)}

.conta{width:100%;height:6px;border-radius:3px;background:var(--borda);overflow:hidden;margin:8px 0 2px}
.conta i{display:block;height:100%;width:100%;background:var(--acento);transition:width linear}
.ok-est .dois{width:100%}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grande{border-radius:20px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;box-shadow:var(--sombra)}

.grande.v{background:var(--verde-bg);color:var(--verde)}.grande.a{background:var(--amar-bg);color:var(--amar-esc)}.grande.a i{color:var(--amar);-webkit-text-stroke:1px #B7950B}
.grande small{font-weight:500;font-size:11px;opacity:.8}
.motivo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--sombra);border-left:5px solid var(--verde)}
.motivo.a{border-left-color:var(--amar)}
.motivo .tx{flex:1;min-width:0}.motivo b{display:block;font-weight:600}.motivo small{color:var(--mut);font-size:12px;display:block;margin-top:1px}
.motivo .fav{color:#F39C12}
.voltar{display:flex;align-items:center;gap:6px;color:var(--acento);font-weight:600;padding:6px 0 10px}
/* telas de entrada (parear / PIN) */
.entrada{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--topo)) 22px calc(24px + var(--baixo));background:linear-gradient(160deg,#0077C8 0%,#003D71 70%);color:#fff}
.entrada .marca{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.entrada .marca img.ic{width:76px;height:76px;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.entrada .ksb{margin-bottom:10px}
.entrada .ksb img{height:30px;width:auto;display:block;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
.entrada .marca b{font-size:22px;font-weight:700}.entrada .marca small{opacity:.8;font-size:13px}
.entrada .caixa{background:var(--card);color:var(--txt);border-radius:22px;padding:18px;width:100%;max-width:400px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.pontos{display:flex;justify-content:center;gap:14px;margin:8px 0 18px}.pontos i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}.pontos i.on{background:#fff;border-color:#fff}
.pontos.erro{animation:treme .35s}
@keyframes treme{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.teclado{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center}
.teclado button{height:76px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:28px;font-weight:500}
.teclado button:active{background:rgba(255,255,255,.3)}.teclado button.lim{background:none;font-size:15px}
.entrada .pin-msg{min-height:22px;font-size:13px;margin-bottom:6px;text-align:center;opacity:.95}
.entrada .rodape{margin-top:20px;font-size:11px;opacity:.7;text-align:center}
.entrada a{color:#fff}
/* aviso (toast) */
.toast{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--baixo));z-index:60;background:#1B2631;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);transform:translateY(calc(100% + 140px));visibility:hidden;transition:transform .25s,visibility 0s .25s;max-width:560px;margin:0 auto}
.toast.on{transform:none;visibility:visible;transition:transform .25s}.toast .tx{flex:1;min-width:0}.toast button{color:#7FC4FF;font-weight:700;padding:4px 6px}

.ver{text-align:center;color:var(--mut);font-size:11px;margin:18px 0 6px;line-height:1.6}
.alerta{border-left:5px solid var(--amar)}.alerta.carta{border-left-color:var(--verm)}
.selo{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;flex-shrink:0}.selo.verbal{background:var(--amar-bg);color:var(--amar-esc)}.selo.carta{background:var(--verm-bg);color:var(--verm)}

.mini-bar{height:8px;border-radius:5px;background:var(--borda);display:flex;overflow:hidden;margin-top:6px}.mini-bar i{display:block;height:100%}

<body>
<div id="app"></div>
<div class="veu" id="veu" onclick="fecharFolha()"></div>

<script src="estrelas-regras.js"></script>
<script>
'use strict';
const VERSAO = '1.2.1';
const LS = { cfg: 'est-cfg', dados: 'est-dados', tent: 'est-tent', pref: 'est-pref' };
const URL_OK = u => /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) || (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && /^http:\/\/127\.0\.0\.1:\d+\/exec$/.test(u));
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const dataBR = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const iniciais = n => String(n || '').split(/\s+/).filter(Boolean).filter((x, i, a) => i === 0 || i === a.length - 1).map(x => x[0]).join('').toUpperCase();
const curto = n => { const p = String(n || '').split(/\s+/).filter(Boolean); return p.length > 2 ? p[0] + ' ' + p[p.length - 1] : p.join(' '); };
const abrev = n => { const p = String(n || '').split(/\s+/).filter(Boolean); return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] + '.' : p.join(' '); }; // cabeçalho: Rogerinho R.
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
const COR = { 'Destaque': 'v', 'Atenção': 'a' };
const ICO_COMP = { 'Segurança': 'bi-shield-check', 'Qualidade': 'bi-rulers', 'Foco e disciplina': 'bi-bullseye', 'Colaboração e iniciativa': 'bi-people' };
const est = (tipo, tam) => `<i class="bi bi-star-fill st-${COR[tipo] || 'v'}" ${tam ? `style="font-size:${tam}px"` : ''}></i>`;
const ler = (k, p) => { try { return JSON.parse(localStorage.getItem(k)) ?? p; } catch (_) { return p; } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

// ---------------------------------------------------------------- cofre (PIN → chave AES-GCM; nada legível no aparelho sem o PIN)
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let K = null, C = null; // chave AES e configuração (url, chave, líder) só na memória enquanto destravado
let D = vazioD();
function vazioD() { return { equipe: { pessoas: [], maquinas: [], grupos: [] }, motivos: [], competencias: [], verbal: 2, limite: 3, dias: 30, estrelas: [], fila: [], equipeEm: 0, sincEm: 0, modelos: null }; }
async function derivar(pin, salt) {
  const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv: b64(iv), ct: b64(new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, K, te.encode(JSON.stringify(obj))))) }; }
async function decifrar(o) { return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(o.iv) }, K, ub64(o.ct)))); }
let salvando = Promise.resolve();
function salvarD() { salvando = salvando.then(async () => { if (K) gravar(LS.dados, await cifrar(D)); }).catch(() => {}); return salvando; }
function apagarTudo() { [LS.cfg, LS.dados, LS.tent].forEach(k => { try { localStorage.removeItem(k); } catch (_) {} }); K = null; C = null; D = vazioD(); }

// ---------------------------------------------------------------- planilha (Apps Script /exec; texto puro = sem pré-verificação CORS)
async function chamar(acao, extra, url, chave) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
  try {
    const r = await fetch(url || C.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...extra, acao, chave: chave === undefined ? C.chave : chave }), redirect: 'follow', signal: ctl.signal, cache: 'no-store' });
    const j = await r.json().catch(() => ({ ok: false, erro: 'A planilha não respondeu como esperado (HTTP ' + r.status + ').' }));
    if (!j.ok && /Chave inválida/.test(j.erro || '') && C) { revogado(); }
    return j;
  } catch (e) { return { ok: false, offline: true, erro: e.name === 'AbortError' ? 'Tempo esgotado.' : 'Sem internet.' }; }
  finally { clearTimeout(t); }
}
function revogado() {
  apagarTudo();
  telaParear('Este celular foi desconectado da planilha (revogado no PC ou chave trocada). Peça um novo código de pareamento.');
}

// ---------------------------------------------------------------- PIN, espera e bloqueio por inatividade
const pref = () => ({ minutos: 5, ...ler(LS.pref, {}) });
let ultimo = Date.now(), escondidoEm = 0;

// ---------------------------------------------------------------- sincronização (fila primeiro: nada se perde sem internet)
let sincronizando = false, deNovo = false;
async function enviarFila() {
  if (!D.fila.length) return;
  const lote = D.fila.slice(0, 100);
  const j = await chamar('salvarEstrelas', { estrelas: lote });
  if (!j.ok) return;
  const okIds = new Set(j.resultado.filter(r => r.ok).map(r => r.id)), ruins = j.resultado.filter(r => !r.ok);
  const sai = new Set([...okIds, ...ruins.map(r => r.id)]);
  D.fila = D.fila.filter(e => !sai.has(e.id));
  D.estrelas.forEach(e => { if (okIds.has(e.id)) e.pendente = false; });
  if (ruins.length) { D.estrelas = D.estrelas.filter(e => !ruins.some(r => r.id === e.id)); toast(ruins.length + ' estrela(s) recusada(s): ' + ruins[0].erro, 'erro'); }
  await salvarD();
}
async function sincronizar(forcarEquipe) {
  if (!K) return; if (sincronizando) { deNovo = true; return; } sincronizando = true; deNovo = false; marcaRede(true);
  try {
    await enviarFila();
    const desde = ESTRELAS.isoMenos(ESTRELAS.isoHoje(), 90);
    const precisaEquipe = forcarEquipe || !D.equipe.pessoas.length || Date.now() - D.equipeEm > 4 * 3600000;
    const [m, e, q] = await Promise.all([chamar('motivos', {}), chamar('estrelas', { desde }), precisaEquipe ? chamar('equipe', {}) : Promise.resolve(null)]);
    if (!K) return;

    if (e.ok) { const pend = D.estrelas.filter(x => x.pendente && D.fila.some(f => f.id === x.id)); D.estrelas = e.estrelas.concat(pend); }
    if (q && q.ok) { D.equipe = { pessoas: q.pessoas, maquinas: q.maquinas, grupos: q.grupos }; D.equipeEm = Date.now(); }
    else if (q && !q.ok && !q.offline) toast(q.erro, 'erro');
    if (m.ok || e.ok) D.sincEm = Date.now();
    marcaRede(!(m.offline || e.offline));
    await salvarD(); render();
  } finally { sincronizando = false; if (deNovo && K) setTimeout(sincronizar, 300); }
}

  requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('#contaBar'); if (b) { b.style.transitionDuration = SEG + 's'; b.style.width = '0'; } }));

  confT = setInterval(() => { n--; const c = $('#contaN'); if (c) c.textContent = n; if (n <= 0) fecharFolha(); }, 1000);
}
async function desfazer(id) {
  if (D.fila.some(e => e.id === id)) { D.fila = D.fila.filter(e => e.id !== id); D.estrelas = D.estrelas.filter(e => e.id !== id); await salvarD(); render(); return toast('Desfeito.'); }
  const j = await chamar('cancelarEstrela', { id });
  if (!j.ok) return toast(j.erro, 'erro');
  const e = D.estrelas.find(x => x.id === id); if (e) e.situacao = 'Cancelada'; await salvarD(); render(); toast('Estrela cancelada.');
}

// ---------------------------------------------------------------- recentes, alertas, resumo
function abaHoje() {
  const d7 = ESTRELAS.isoMenos(ESTRELAS.isoHoje(), 6);
  const L = D.estrelas.filter(e => e.data >= d7).sort((a, b) => (b.data + b.hora).localeCompare(a.data + a.hora));
  const dias = [...new Set(L.map(e => e.data))];
  $('#corpo').innerHTML = L.length ? dias.map(d => `<div class="maq-tit">${d === ESTRELAS.isoHoje() ? 'Hoje' : dataBR(d)}</div><div class="card">${L.filter(e => e.data === d).map(e => `<div class="lin ${e.situacao === 'Cancelada' ? 'cancel' : ''}">${est(e.tipo, 22)}<div class="tx"><b>${esc(curto(e.nome))}</b><small>${esc(e.hora)} · ${esc(e.motivo)} · ${esc(e.maquina || '')}${e.pendente ? ' · <i class="bi bi-cloud-slash"></i> aguardando internet' : ''}</small></div>${e.situacao === 'Cancelada' ? '<small class="sub">cancelada</small>' : `<button class="bt peq" onclick="if(confirm('Cancelar esta estrela?'))desfazer('${esc(e.id)}')"><i class="bi bi-x-lg"></i></button>`}</div>`).join('')}</div>`).join('') : '<div class="vazio"><i class="bi bi-star"></i>Nenhuma estrela nos últimos 7 dias.</div>';
}
function abaAlertas() {
  const A = ESTRELAS.alertas(D.estrelas, D);
  $('#corpo').innerHTML = `<div class="msg info"><i class="bi bi-info-circle"></i><div>Mesmo motivo de ${est('Atenção')} em ${D.dias} dias: ${D.verbal ? `<b>${D.verbal}</b> → formalizar orientação verbal · ` : ''}<b>${D.limite}</b> → carta. É sugestão: converse e faça no PC (Estrelas › Alertas).</div></div>
    ${A.length ? A.map(a => `<div class="card alerta ${a.nivel}"><div class="lin" style="padding:0;border:0"><span class="av">${esc(iniciais(a.nome))}</span><div class="tx"><b>${esc(curto(a.nome))}</b><small>${esc(a.motivo)} · ${a.qtd}× em ${a.datas.map(dataBR).join(', ')}</small></div><span class="selo ${a.nivel}">${a.nivel === 'carta' ? 'Carta' : 'Verbal'}</span></div></div>`).join('') : '<div class="vazio"><i class="bi bi-emoji-smile"></i>Nenhum alerta aberto.</div>'}`;
}
function abaResumo() {
  const mes = ESTRELAS.isoHoje().slice(0, 7), R = ESTRELAS.resumo(D.estrelas, mes + '-01', mes + '-31');
  const C2 = D.competencias.length ? D.competencias : Object.keys(R.comp);
  const barra = (d, a) => { const t = Math.max(1, d + a); return `<div class="mini-bar"><i style="width:${d / t * 100}%;background:var(--verde)"></i><i style="width:${a / t * 100}%;background:var(--amar)"></i></div>`; };
  $('#corpo').innerHTML = `<div class="card"><h3><i class="bi bi-calendar3"></i>Este mês</h3><div class="dois" style="margin:0"><div class="grande v" style="padding:12px"><span class="cnt" style="font-size:28px">${R.d}</span><small>Destaques</small></div><div class="grande a" style="padding:12px"><span class="cnt" style="font-size:28px">${R.a}</span><small>Atenções</small></div></div>
      <div class="sub" style="margin-top:10px">Verde : amarela = <b>${R.proporcao === null ? (R.d ? 'só verdes' : '—') : R.proporcao.toFixed(1).replace('.', ',') + ' : 1'}</b> · meta da liderança ≥ 3 : 1</div></div>
    <div class="card"><h3><i class="bi bi-diagram-3"></i>Por competência</h3>${C2.map(c => { const x = R.comp[c] || { d: 0, a: 0 }; return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span><i class="bi ${ICO_COMP[c] || 'bi-dot'}"></i> ${esc(c)}</span><span class="cnt">${x.d} ${est('Destaque')} ${x.a} ${est('Atenção')}</span></div>${barra(x.d, x.a)}</div>`; }).join('')}</div>
    <div class="card"><h3><i class="bi bi-people"></i>Pessoas</h3>${R.pessoas.length ? R.pessoas.map(p => `<div class="lin"><div class="tx"><b>${esc(curto(p.nome))}</b>${barra(p.d, p.a)}</div><span class="cnt">${p.d} ${est('Destaque')} ${p.a} ${est('Atenção')}</span></div>`).join('') : '<div class="sub">Nada neste mês.</div>'}</div>`;
}

// ---------------------------------------------------------------- mais: sincronizar, motivos (admin), bloqueio, desparear
function abaMais() {
  const adm = C.papel === 'Admin', pr = pref();
  $('#corpo').innerHTML = `<div class="card"><h3><i class="bi bi-cloud-check"></i>Planilha</h3><div class="sub">${esc(C.planilha || '')}<br>Última sincronização: ${D.sincEm ? new Date(D.sincEm).toLocaleString('pt-BR') : '—'}<br>Equipe: ${D.equipe.pessoas.length} pessoas${D.fila.length ? `<br><b>${D.fila.length} estrela(s) esperando internet</b>` : ''}</div>
      <div style="margin-top:10px"><button class="bt" onclick="sincronizar(true)"><i class="bi bi-arrow-repeat"></i> Sincronizar agora</button></div></div>
    <div class="card"><h3><i class="bi bi-list-stars"></i>Motivos ${adm ? '' : '<small class="sub">(só o administrador edita)</small>'}</h3>
      ${['Destaque', 'Atenção'].map(t => `<div class="maq-tit" style="margin-top:4px">${est(t)} ${t}${adm ? `<button class="bt peq" style="margin-left:auto" onclick="editarMotivo('','${t}')"><i class="bi bi-plus-lg"></i></button>` : ''}</div>${D.motivos.filter(m => m.tipo === t).sort((a, b) => a.ordem - b.ordem).map((m, i, L) => `<div class="lin"><button class="bt peq" ${adm ? `onclick="favMotivo('${esc(m.id)}')"` : 'disabled'} style="${m.favorito ? 'color:#F39C12' : ''}"><i class="bi ${m.favorito ? 'bi-bookmark-star-fill' : 'bi-bookmark'}"></i></button><div class="tx"><b>${esc(m.nome)}</b><small>${esc(m.competencia)}</small></div>${adm ? `<button class="bt peq" ${i ? '' : 'disabled'} onclick="moverMotivo('${esc(m.id)}',-1)"><i class="bi bi-arrow-up"></i></button><button class="bt peq" onclick="editarMotivo('${esc(m.id)}')"><i class="bi bi-pencil"></i></button>` : ''}</div>`).join('')}`).join('')}</div>
    <div class="card"><h3><i class="bi bi-shield-lock"></i>Segurança</h3>
      <label class="campo">Bloquear depois de<select onchange="const p=pref();p.minutos=Number(this.value);gravar(LS.pref,p)">${[1, 3, 5, 10].map(n => `<option value="${n}" ${n === pr.minutos ? 'selected' : ''}>${n} minuto${n > 1 ? 's' : ''} sem uso</option>`).join('')}</select></label>
      <button class="bt perigo" onclick="desparear()"><i class="bi bi-phone-flip"></i> Desconectar este celular</button></div>
    <div id="dicaInstalar"></div>
    <div class="ver">Estrelas da Ronda v${VERSAO}<br>KSB Brasil © 2026 · Processo Usinagem<br>&lt;/&gt; Rogerinho Ramos · Col 3:23</div>`;
  dicaInstalar();
}
function desparear() {
  if (!confirm('Desconectar e apagar os dados deste celular?' + (D.fila.length ? ' ' + D.fila.length + ' estrela(s) ainda não subiram e serão perdidas.' : ''))) return;
  apagarTudo(); telaParear('Celular desconectado. Para revogar a chave também, use o PC (Estrelas › Celular › Revogar).');
}
async function motivosAdmin(acao, extra, msg) {
  const j = await chamar(acao, extra); if (!j.ok) { toast(j.erro, 'erro'); return false; }
  const m = await chamar('motivos', {}); if (m.ok) { Object.assign(D, { motivos: m.motivos }); await salvarD(); }
  if (msg) toast(msg); render(); return true;
}
function favMotivo(id) { const m = D.motivos.find(x => x.id === id); motivosAdmin('salvarMotivo', { motivo: { ...m, favorito: !m.favorito } }); }
function moverMotivo(id, d) {
  const L = D.motivos.slice().sort((a, b) => a.ordem - b.ordem), mesmo = L.filter(x => x.tipo === L.find(y => y.id === id).tipo), k = mesmo.findIndex(x => x.id === id), alvo = mesmo[k + d]; if (!alvo) return;
  const ids = L.map(x => x.id), a = ids.indexOf(id), b = ids.indexOf(alvo.id); [ids[a], ids[b]] = [ids[b], ids[a]];
  motivosAdmin('ordenarMotivos', { ids });
}
async function editarMotivo(id, tipoNovo) {
  const m = D.motivos.find(x => x.id === id) || { id: '', tipo: tipoNovo, nome: '', competencia: D.competencias[0], frase: '', carta: '', favorito: false };
  if (m.tipo === 'Atenção' && !D.modelos) { const r = await chamar('modelos', {}); D.modelos = r.ok && !r.vazio ? r.modelos.map(x => ({ id: x.id, nome: x.nome })) : [{ id: 'celular', nome: 'Celular' }, { id: 'epi', nome: 'EPI' }, { id: 'risco', nome: 'Conduta de risco' }, { id: 'pontualidade', nome: 'Pontualidade' }, { id: 'faltas', nome: 'Faltas' }, { id: 'conduta', nome: 'Conduta' }, { id: 'autocontrole', nome: 'Autocontrole' }, { id: 'foco', nome: 'Foco no trabalho' }]; }
  F = { motivo: m };
  abrirFolha(`<div class="f-cab"><div class="tx"><b>${id ? 'Editar motivo' : 'Novo motivo'}</b><small>${est(m.tipo)} ${m.tipo}</small></div><button class="bt peq" onclick="fecharFolha()"><i class="bi bi-x-lg"></i></button></div>
    <label class="campo">Nome curto (até 40)<input id="moNome" maxlength="40" value="${esc(m.nome)}"></label>
    <label class="campo">Competência<select id="moComp">${D.competencias.map(c => `<option ${c === m.competencia ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    ${m.tipo === 'Atenção' ? `<label class="campo">Carta ligada no alerta<select id="moCarta"><option value="">Nenhuma</option>${(D.modelos || []).map(x => `<option value="${esc(x.id)}" ${x.id === m.carta ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>` : ''}
    <label class="campo">${m.tipo === 'Destaque' ? 'Frase de reconhecimento' : 'O que dizer na hora'}<textarea id="moFrase" rows="2" maxlength="200">${esc(m.frase)}</textarea></label>
    <label class="campo" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="moFav" style="width:auto" ${m.favorito ? 'checked' : ''}> Favorito (aparece primeiro)</label>
    <button class="bt pri lg" onclick="salvarMotivo()"><i class="bi bi-check2"></i> Salvar</button>
    ${id ? `<button class="bt perigo lg" style="margin-top:8px" onclick="excluirMotivo('${esc(id)}')"><i class="bi bi-trash"></i> Excluir da lista</button>` : ''}`);
}
async function salvarMotivo() {
  const m = { ...F.motivo, nome: $('#moNome').value.trim(), competencia: $('#moComp').value, frase: $('#moFrase').value.trim(), carta: $('#moCarta') ? $('#moCarta').value : '', favorito: $('#moFav').checked };
  if (!m.nome) return toast('Dê um nome curto.', 'erro');
  if (await motivosAdmin('salvarMotivo', { motivo: m }, 'Motivo salvo.')) fecharFolha();
}
async function excluirMotivo(id) { if (!confirm('Excluir da lista? As estrelas antigas continuam no histórico.')) return; if (await motivosAdmin('excluirMotivo', { id }, 'Motivo excluído.')) fecharFolha(); }

// ---------------------------------------------------------------- aviso, instalação, início
function toast(html, tipo, botao, acao, ehHtml) {
  const t = $('#toast'), b = $('#toastBt');
  $('#toastTx').innerHTML = ehHtml ? html : esc(html);
  t.className = 'toast on ' + (tipo || '');
  b.classList.toggle('oculto', !botao); b.textContent = botao || ''; b.onclick = () => { t.classList.remove('on'); acao && acao(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), botao ? 6000 : tipo === 'erro' ? 6000 : 3000);
}
let pedidoInstalar = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedidoInstalar = e; dicaInstalar(); });
addEventListener('appinstalled', () => { pedidoInstalar = null; dicaInstalar(); });
function dicaInstalar() {
  const el = $('#dicaInstalar'); if (!el) return;
  const instalado = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iPhone|iPad/.test(navigator.userAgent);
  if (instalado || ler(LS.pref, {}).semDica) { el.innerHTML = ''; return; }
  if (pedidoInstalar) el.innerHTML = `<button class="bt pri lg" style="margin-top:10px" onclick="pedidoInstalar.prompt();pedidoInstalar.userChoice.then(()=>{pedidoInstalar=null;dicaInstalar()})"><i class="bi bi-download"></i> Instalar o app</button>`;
  else if (ios) el.innerHTML = `<div class="msg info" style="margin-top:10px"><i class="bi bi-box-arrow-up"></i><div>No iPhone: toque em <b>Compartilhar</b> › <b>Adicionar à Tela de Início</b>. Depois <b>abra pelo ícone e faça o pareamento lá</b> (o iPhone não passa os dados do Safari para o app instalado).</div></div>`;
  else el.innerHTML = '';
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(127\.0\.0\.1|localhost)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!window.crypto || !crypto.subtle) document.body.innerHTML = '<div class="vazio">Este navegador não tem criptografia. Abra pelo Chrome ou Safari atualizado.</div>';
else if (ler(LS.cfg, null)) telaPin('entrar'); else telaParear();
</script>
